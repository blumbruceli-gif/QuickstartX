<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: engineering-suite shell. Title bar, tool ribbon, left measuring program, centre viewport, right inspector, bottom status dock. Blue = interface, orange = measuring elements on the drawing, teal = probe path. */
:root{
  --sans:'Figtree','IBM Plex Sans','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --chrome:#1f1533; --chrome-ink:#f3eefb; --chrome-dim:#b3a4cc; --chrome-hover:#33254d; --chrome-line:#3d2d5c;
  --bg:#ece9f1; --panel:#f8f6fb; --ribbon:#f0edf5; --canvas:#fdfcfe; --ink:#1d1628; --ink2:#5f5870; --line:#d9d3e3;
  --grid:#f1eef6; --grid2:#e3deec; --drawing:#3b2d57;
  --ui:#7a3fc0; --ui-ink:#ffffff; --ui-soft:#eadcf8;
  --accent:#cf3a86; --accent-ink:#ffffff; --accent-soft:#fbe0ec;
  --path:#00857a; --ok:#1b8049; --warn:#a85f00; --err:#c0332b; --code:#f1eef6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --chrome:#0c0713; --chrome-ink:#efe9f8; --chrome-dim:#a99bc0; --chrome-hover:#241a35; --chrome-line:#2c2140;
  --bg:#120d19; --panel:#1a1423; --ribbon:#1f182a; --canvas:#0f0a15; --ink:#ece6f4; --ink2:#9f95b3; --line:#2f2640;
  --grid:#171120; --grid2:#231b30; --drawing:#cdb8ee;
  --ui:#c28bf5; --ui-ink:#1b0c2b; --ui-soft:#2f1f47;
  --accent:#ff9cc2; --accent-ink:#2a0716; --accent-soft:#44202f;
  --path:#4fd0c4; --ok:#4cc784; --warn:#e0a040; --err:#ff7a70; --code:#140e1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --chrome:#0c0713; --chrome-ink:#efe9f8; --chrome-dim:#a99bc0; --chrome-hover:#241a35; --chrome-line:#2c2140;
  --bg:#120d19; --panel:#1a1423; --ribbon:#1f182a; --canvas:#0f0a15; --ink:#ece6f4; --ink2:#9f95b3; --line:#2f2640;
  --grid:#171120; --grid2:#231b30; --drawing:#cdb8ee;
  --ui:#c28bf5; --ui-ink:#1b0c2b; --ui-soft:#2f1f47;
  --accent:#ff9cc2; --accent-ink:#2a0716; --accent-soft:#44202f;
  --path:#4fd0c4; --ok:#4cc784; --warn:#e0a040; --err:#ff7a70; --code:#140e1b; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans)}
*{box-sizing:border-box}
svg{display:block}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
/* title bar */
.titlebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;background:var(--chrome);color:var(--chrome-ink);padding:6px 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;flex:none;padding:4px}.mark svg{width:100%;height:100%}
.brand b{display:block;font-size:14px;font-weight:600;letter-spacing:.01em;line-height:1.2}
.wm{font:500 21px/1.1 'Figtree',var(--sans)!important;letter-spacing:-.01em}.wm i{font-style:normal;color:#c77dff;margin-left:1px;font-weight:600}
.brand span{display:block;color:var(--chrome-dim);font:10.5px var(--mono);line-height:1.2}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.actions .note{color:var(--chrome-dim)}
.sep{width:1px;height:20px;background:var(--chrome-line);margin-inline:6px}
.btn{font:inherit;padding:5px 11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--ui);border-color:var(--ui);color:var(--ui-ink)}
.titlebar .btn{background:transparent;border-color:transparent;color:var(--chrome-ink);padding:5px 9px}
.titlebar .btn:hover{background:var(--chrome-hover)}
.titlebar .btn.pri{background:var(--ui);color:var(--ui-ink)}
.titlebar .btn.pri:hover{filter:brightness(1.1)}
.btn svg{width:16px;height:16px;flex:none}
.btn:focus-visible,.tb:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible,.dg:focus-visible{outline:2px solid var(--ui);outline-offset:1px}
/* ribbon */
.ribbon{background:var(--ribbon);border-bottom:1px solid var(--line);display:flex;align-items:stretch;overflow-x:auto}
.tools{display:flex;align-items:stretch;padding:4px 8px 0;gap:0}
.rg{display:flex;flex-direction:column;padding:0 8px;border-right:1px solid var(--line)}
.rg:last-child{border-right:0}
.rb{display:flex;gap:2px;flex:1;align-items:stretch}
.rl{font:600 10px var(--sans);letter-spacing:.08em;color:var(--ink2);text-align:center;padding:3px 0 4px;text-transform:uppercase;white-space:nowrap}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:62px;padding:6px 6px 4px;border:1px solid transparent;border-radius:4px;background:none;color:var(--ink);font:inherit;font-size:11.5px;line-height:1.2;cursor:pointer;white-space:nowrap}
.tb svg{width:26px;height:26px;color:var(--ink)}
.tb:hover{background:var(--grid2)}
.tb[aria-pressed="true"]{background:var(--ui-soft);border-color:var(--ui);color:var(--ui)}
.tb[aria-pressed="true"] svg{color:var(--ui)}
/* body */
.shell{min-height:0;display:grid;grid-template-columns:248px minmax(0,1fr) 380px;background:var(--panel)}
.seq{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.phd{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);font:600 11px var(--sans);letter-spacing:.08em;color:var(--ink2);text-transform:uppercase}
.cnt{font:600 11px var(--mono);background:var(--grid2);color:var(--ink);border-radius:10px;padding:0 7px;letter-spacing:0}
.seqlist{flex:1;overflow:auto;min-height:0;padding:4px 0}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.cvwrap{position:relative;flex:1;min-height:0;background:var(--canvas);border-bottom:1px solid var(--line)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hint{position:absolute;left:10px;top:8px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ui);padding:4px 10px;font-size:12px;color:var(--ink2);pointer-events:none;max-width:calc(100% - 20px);border-radius:3px;box-shadow:0 1px 3px rgba(10,20,40,.12)}
.hint:empty{display:none}
.vsw{position:absolute;right:10px;top:8px;display:flex;border:1px solid var(--line);background:var(--panel);border-radius:4px;overflow:hidden;box-shadow:0 1px 3px rgba(10,20,40,.12)}
.vsw button.ic{width:34px;padding:4px}.vsw button.ic svg{width:100%;height:100%;display:block}.vsw button{border:0;background:none;color:var(--ink2);font:inherit;padding:5px 11px;cursor:pointer}
.vsw button+button{border-left:1px solid var(--line)}
.vsw button[aria-pressed="true"]{background:var(--ui);color:var(--ui-ink)}
.vcube{position:absolute;right:10px;top:42px;display:flex;flex-direction:column;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 4px rgba(10,20,40,.18);opacity:.94}.vcube[hidden]{display:none}
.vcube .mhr{display:flex;gap:3px}.vcube .mg{display:grid;grid-template-columns:repeat(3,30px);gap:2px}
.vcube button{width:30px;height:30px;border:0;background:none;color:var(--ink2);border-radius:4px;padding:3px;cursor:pointer}.vcube button:hover{background:var(--grid2);color:var(--ink)}.vcube button[aria-pressed="true"]{background:var(--ui-soft);color:var(--ui)}.vcube svg{width:100%;height:100%;display:block}
.vcube .mh{flex:1;width:auto;height:24px;font:600 11px var(--sans);border:1px solid var(--line)}.vcube .mh[aria-pressed="true"]{background:var(--ui);color:var(--ui-ink);border-color:var(--ui)}
.vsw button:focus-visible{outline:2px solid var(--ui);outline-offset:-2px}
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:6px 12px;background:var(--ribbon)}
.simbar input[type=range]{flex:1;min-width:120px;accent-color:var(--ui)}
.simbar .ro{font:11.5px var(--mono);color:var(--ink2);min-width:0}
.simbar .btn{padding:4px 12px}
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
.tabs{display:flex;background:var(--ribbon);border-bottom:1px solid var(--line)}
.tab{flex:1;padding:9px 4px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ink2);font:inherit;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ui);border-bottom-color:var(--ui);font-weight:600;background:var(--panel)}
.pane{flex:1;overflow:auto;padding:12px 14px;min-height:0}
h3{margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);font:600 11px var(--sans);letter-spacing:.08em;color:var(--ink2);text-transform:uppercase}
h3:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;border-left:3px solid transparent;cursor:pointer}
.row:hover{background:var(--grid2)}
.row.on{background:var(--ui-soft);border-left-color:var(--ui)}
.row .no{font:600 11px var(--mono);width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.rtx{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:11px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.e{background:var(--err)}.dot.w{background:var(--warn)}
.chip{font-size:10.5px;color:var(--ink2);border:1px solid var(--line);padding:0 5px;border-radius:3px;white-space:nowrap}
.chip.set{color:var(--path);border-color:var(--path)}
.row.colr{background:rgba(209,44,44,.10);border-left-color:var(--err)}
.colb{flex:none;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--err);background:var(--err);color:#fff;border-radius:999px;padding:3px 8px 3px 6px;font:700 11px var(--sans);cursor:pointer}
.colb svg{width:14px;height:14px}
.coltip{position:fixed;z-index:70;background:var(--panel);color:var(--ink);border:1px solid var(--err);border-left-width:4px;border-radius:6px;padding:9px 12px;box-shadow:0 8px 28px rgba(0,0,0,.35);font-size:12.5px;line-height:1.5}
.coltip b{display:block;color:var(--err);font-size:13.5px;margin-bottom:3px}.coltip p{margin:3px 0}.coltip .why{color:var(--ink)}.coltip .fix{color:var(--ink2)}
.row{cursor:grab}.row.drag{opacity:.45}.row.dropb{box-shadow:inset 0 2px 0 var(--ui)}.row.dropa{box-shadow:inset 0 -2px 0 var(--ui)}
.fld{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:8px;align-items:center;margin-block:4px}
.fld.chk{display:flex;gap:8px;align-items:center}
.fld span{color:var(--ink2);min-width:0}
.fld input[type=checkbox]{accent-color:var(--ui)}
.fld input[type=number],.fld input[type=text],.fld select,textarea{width:100%;min-width:0;font:inherit;padding:4px 7px;border:1px solid var(--line);background:var(--canvas);color:var(--ink);border-radius:3px}
.fld input:focus,.fld select:focus,textarea:focus{border-color:var(--ui)}
.fld input[type=number]{font-family:var(--mono)}
textarea{font:11.5px var(--mono);min-height:64px;resize:vertical}
.empty{color:var(--ink2);padding:14px 12px;line-height:1.7}
.code{font:12px/1.6 var(--mono);background:var(--code);border:1px solid var(--line);padding:8px 0;overflow:auto;margin:8px 0 0;border-radius:3px}
.ln{display:flex;padding:0 10px;white-space:pre}
.ln i{color:var(--ink2);width:2.8em;font-style:normal;user-select:none;flex:none;opacity:.7}
.ln.c{color:var(--ink2)}
.ln.hl{background:var(--ui-soft)}
.warn{margin:6px 0 0;padding:0;list-style:none}
.warn li{padding:5px 8px 5px 10px;border-left:3px solid var(--line);margin-block:4px;background:var(--grid)}
.warn li.w{border-left-color:var(--warn)}
.warn li.e{border-left-color:var(--err)}
.warn li.i{border-left-color:var(--path)}
.rtab th,.rtab td{padding:5px 4px;font-size:11px}.rtab th{white-space:normal}.rtab td:first-child{min-width:84px}.rtab td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.rtab tr.f td{border-top:1px solid var(--line2,var(--line))}.rtab tr.bad td{color:var(--err)}
.rtab td.st{text-align:center;font-weight:700}.rtab td.st.ok{color:#1f8a3b}.rtab td.st.hi,.rtab td.st.lo,.rtab td.st.ng,.rtab td.st.bad{color:var(--err)}.rtab td.st.miss{color:var(--warn)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--grid2)}.pill.ok{background:#dff3e5;color:#176a2d}.pill.ng{background:#fbe0e0;color:#a52020}.pill.ms{background:#fdf0d4;color:#8a5a00}
#rpv{position:fixed;inset:0;z-index:50;background:rgba(15,20,30,.72);display:flex;flex-direction:column}.rpvbar{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--panel);color:var(--ink)}.rpvbar b{margin-right:auto}
.rpvsc{overflow:auto;flex:1;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px}.rpvsc img{width:min(900px,100%);height:auto;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.tblw{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;font-size:12px;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:500;white-space:nowrap;background:var(--grid)}
td.m{font:11.5px var(--mono);white-space:pre}
.note{color:var(--ink2);font-size:12px;margin:6px 0}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dock{display:flex;align-items:center;gap:12px;background:var(--chrome);color:var(--chrome-dim);padding:0 12px;min-height:26px}
.dgs{display:flex;gap:4px;flex:none}
.dg{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--chrome-ink);font:11.5px var(--sans);padding:3px 8px;border-radius:3px;cursor:pointer}
.dg:hover{background:var(--chrome-hover)}
.dg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.dg.e i{background:var(--err)}.dg.w i{background:var(--warn)}.dg.i i{background:var(--path)}.dg.ok i{background:var(--ok)}
.status{font:11px var(--mono);color:var(--chrome-dim);padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:right}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:4px;z-index:9;max-width:calc(100% - 32px)}


.menu{position:relative}
.mbtn{gap:6px}
.mpop{display:none;position:absolute;left:0;top:calc(100% + 4px);min-width:210px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(8,16,32,.28);padding:4px;z-index:30}
.menu.open .mpop{display:block}
.menu.open .mbtn{background:var(--chrome-hover)}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border:0;background:none;color:inherit;font:inherit;border-radius:4px;cursor:pointer;white-space:nowrap}
.mi:hover,.mi:focus-visible{background:var(--grid2);outline:0}
.mi svg{width:16px;height:16px;flex:none;color:var(--ink2)}
.msep{height:1px;background:var(--line);margin:4px 2px}
.subtabs{display:flex;gap:2px;padding:3px;margin-bottom:12px;background:var(--grid2);border-radius:6px;position:sticky;top:-12px;z-index:2}
.subtabs button{flex:1;border:0;background:none;color:var(--ink2);font:inherit;font-size:12px;padding:6px 4px;border-radius:4px;cursor:pointer;white-space:nowrap}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-pressed="true"]{background:var(--panel);color:var(--ui);font-weight:600;box-shadow:0 1px 2px rgba(10,20,40,.15)}
.qo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qo .lbl{width:100%;color:var(--ink2);font-size:12px}
.qo button{padding:4px 9px;font-size:12px}
/* origin panel */
.opn{display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.opn .ttl{text-align:center;color:var(--ink2);font-size:13px;padding:2px 0 0}
.ogrp{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--canvas)}
.ogrp .side2{width:38px;flex:none;display:grid;place-items:center}
.ogrp .side2 svg{width:22px;height:22px}
.ogrp.rot .side2{background:#d3e886;color:#2d3a07}
.ogrp.mov .side2{background:#5e6f12;color:#f4f9d8}
.ogrp .rows{flex:1;display:flex;flex-direction:column;gap:8px;padding:10px 12px}
.orow{display:flex;align-items:center;gap:10px}
.axc{width:28px;height:28px;border-radius:4px;background:var(--grid2);color:var(--ink);font:600 13px var(--sans);display:grid;place-items:center;flex:none}
.orow .lb{color:var(--ink2);width:34px;flex:none}
.oin{flex:1;display:flex;align-items:center;gap:6px;background:var(--grid);border:1px solid var(--line);border-radius:4px;padding:0 8px;min-width:0}
.oin input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:13px var(--mono);text-align:right;padding:6px 0;outline:0}
.oin:focus-within{border-color:var(--ui)}
.oin u{text-decoration:none;color:var(--ink2);font-size:12px}
.omode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.omode button{display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 8px;border:1px solid var(--line);background:var(--canvas);color:var(--ink);border-radius:6px;font:inherit;cursor:pointer}
.omode button:hover{border-color:var(--ink2)}
.omode button[aria-pressed="true"]{border-color:var(--ui);box-shadow:inset 0 0 0 1px var(--ui)}
.omode .bd{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.omode .bd svg{width:15px;height:15px}
.omode .r .bd{background:#d3e886;color:#2d3a07}
.omode .m .bd{background:#5e6f12;color:#f4f9d8}
.onote{display:flex;gap:12px;align-items:flex-start;color:var(--ink2);font-size:12.5px}

@media (max-width:600px){

.dlgbg{position:fixed;inset:0;z-index:60;background:rgba(10,15,25,.6);display:grid;place-items:center;padding:16px}

.grip{flex:none;touch-action:none;cursor:grab;color:var(--ink2);padding:6px 3px;font:700 13px/1 var(--sans);letter-spacing:-2px;opacity:.65;user-select:none}
.row .del{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--err);width:30px;height:30px;border-radius:4px;font-size:15px;cursor:pointer;padding:0;display:none}

  .ribbon{-webkit-overflow-scrolling:touch}
}

";SUB["顯示 / 隱藏量測路徑"]="Show / hide measuring path";EX["實體顯示"]="Solid";EX["線框顯示"]="Wireframe";EX["座標軸"]="Axes";EX["量測路徑"]="Measuring path";EX["上視"]="Top view";EX["下視"]="Bottom view";EX["前視"]="Front view";EX["後視"]="Back view";EX["左視"]="Left view";EX["右視"]="Right view";EX["等角"]="Isometric";EX["建立量測報表"]="Create measurement report";SUB["開啟後程式會加入 POPEN、每個量測特徵後的 DPRNT[MP*序號*類型*數值] 與 PCLOS。機台需先設定 DPRNT 輸出通道，把輸出文字存成 .txt 後在此載入。「輸出 DPRNT (V-1.)」是 Blum 循環自己的輸出，不會被報表讀取。"]="When on, the program adds POPEN, a DPRNT[MP*no.*type*values] line after each measuring feature, and PCLOS. Set up a DPRNT output channel on the machine first, save the output as .txt and load it here. \"Output DPRNT (V-1.)\" is the Blum cycle's own output and is not read by the report.";SUB["尺寸 + 中心位置"]="Size + center position";SUB["尺寸上限 +"]="Size upper +";SUB["尺寸下限 −"]="Size lower −";SUB["超出公差時機台報警（同時有尺寸與位置公差時，以尺寸為準）"]="Machine alarms when out of tolerance (size takes priority if both are set)";EX["報表公差"]="Report tolerance";EX["檢查"]="Check";SUB["超出公差時機台報警"]="Machine alarms when out of tolerance";EX["說明"]="Description";EX["值"]="Value";EX["名義值"]="Nominal";EX["量測值"]="Measured";EX["差值"]="Difference";EX["公差"]="Tolerance";EX["狀態"]="State";EX["公差下限"]="Tol. lower";EX["公差上限"]="Tol. upper";EX["客戶"]="Customer";EX["專案"]="Project";EX["零件編號"]="Part No.";EX["CAD 檔案"]="CAD file";EX["座標系"]="Coordinates";EX["控制器"]="Controller";EX["日期"]="Date";EX["機台"]="Machine";EX["探頭"]="Sensor";EX["測針"]="Stylus";EX["操作者"]="Operator";EX["單位"]="Unit";EX["件號"]="Part #";EX["量測結果"]="Results";EX["程式清單"]="Program list";EX["量測報告"]="Measurement Protocol";EX["有件"]="Present";EX["無件"]="Absent";EX["關閉"]="Close";EX["工件"]="Workpiece";EX["中心 X"]="Center X";EX["中心 Y"]="Center Y";EX["中心 "]="Center ";SUB["量測結果回傳 (DPRNT)"]="Measurement result return (DPRNT)";SUB["量測後用 DPRNT 把結果輸出回傳"]="Return results with DPRNT after measuring";SUB["開啟後程式會加入 POPEN、每個量測特徵之後的 DPRNT[MP*序號*類型*數值]，以及 PCLOS。機台需先設定 DPRNT 輸出通道（RS-232、資料伺服器或記憶卡），把輸出的文字存成 .txt，再到「報表」載入，即可與名義值、公差比對並匯出 CSV 與 PDF。「輸出 DPRNT (V-1.)」是 Blum 循環自己的輸出，格式不同，不會被報表讀取。"]="When on, the program adds POPEN, a DPRNT[MP*no.*type*values] line after each measuring feature, and PCLOS. Set up a DPRNT output channel on the machine first (RS-232, data server or memory card), save the output as .txt, then load it in Report to compare against nominal values and tolerances and export CSV and PDF. \"Output DPRNT (V-1.)\" is the Blum cycle's own output; its format differs and the report does not read it.";SUB["載入機台量測結果"]="Load machine results";SUB["機台執行程式後，把 DPRNT 輸出的文字（序列埠擷取、資料伺服器或記憶卡的 .txt）貼在下方，或從檔案匯入。只會讀取以 MP 開頭的結果行；連續執行多個工件時會自動分成多件。"]="After the machine runs the program, paste the DPRNT output text (captured from the serial port, data server or a .txt on the memory card) below, or import it from a file. Only result lines starting with MP are read; consecutive workpieces are split into separate parts automatically.";SUB["解析並載入"]="Parse & load";SUB["從檔案匯入"]="Import from file";SUB["載入示範資料"]="Load demo data";SUB["清除結果"]="Clear results";SUB["目前的 NC 程式沒有加入結果回傳。開啟後，程式會在每個量測特徵之後用 DPRNT 輸出結果；量測完成再把機台輸出的文字載入這裡。"]="The current NC program has no result return. When enabled, the program outputs results with DPRNT after each measuring feature; load the machine's output text here after measuring.";SUB["在程式中加入結果回傳 (DPRNT)"]="Add result return (DPRNT) to the program";SUB["尚無可回傳結果的量測特徵（設定 WCS 用的特徵與路徑點不會回傳）"]="No measuring features that return results (features that set a WCS and waypoints do not return results)";SUB["尚未載入結果。下表顯示名義值與公差；載入後會填入量測值並判定。"]="No results loaded yet. The table shows nominal values and tolerances; measured values are filled in and judged after loading.";SUB["合格 "]="Pass ";SUB["超差 "]="Out of tol. ";SUB["未判定 "]="Unjudged ";SUB["無資料 "]="No data ";SUB["超過上限"]="Above upper limit";SUB["低於下限"]="Below lower limit";SUB["不合格"]="Fail";SUB["未設定公差"]="No tolerance set";SUB["尚無資料"]="No data yet";SUB["程式已變更，與回傳資料不符"]="Program changed; does not match returned data";SUB["部分回傳資料的特徵類型與目前程式不同（程式在量測後被修改過），請重新 /* ============ I18N: runtime zh-Hant / en translation layer (display only) ============ */
(function(){
var CJK=/[㐀-鿿＀-￯　-〿]/;
var LANG='zh';
try{var sv=localStorage.getItem('mp-lang');LANG=sv==='en'||sv==='zh'?sv:(/^zh/i.test(navigator.language||'zh')?'zh':'en')}catch(e){}
var keys=Object.keys(SUB).sort(function(a,b){return b.length-a.length});

/* canvas text */
var P=CanvasRenderingContext2D.prototype;
['fillText','strokeText','measureText'].forEach(function(n){var o=P[n];P[n]=function(t){arguments[0]=tr(String(t));return o.apply(this,arguments)}});
/* clipboard */
try{var cb=navigator.clipboard,wt=cb&&cb.writeText;if(wt)cb.writeText=function(t){return wt.call(cb,tr(t))}}catch(e){}
/* DOM */
var TM=new WeakMap(),AM=new WeakMap(),ATTR=['title','placeholder','aria-label','alt'];
function doText(n){
  var v=n.data,r=TM.get(n);
  if(r&&r.t===v){if(LANG!=='en'){n.data=r.o;TM.delete(n)}return}
  if(LANG==='en'&&CJK.test(v)){var t=tr(v);if(t!==v){TM.set(n,{o:v,t:t});n.data=t}}}
function doAttr(el){
  var rec=AM.get(el);
  ATTR.forEach(function(a){
    if(!el.hasAttribute(a))return;var v=el.getAttribute(a),r=rec&&rec[a];
    if(r&&r.t===v){if(LANG!=='en'){el.setAttribute(a,r.o);delete rec[a]}return}
    if(LANG==='en'&&CJK.test(v)){var t=tr(v);if(t!==v){if(!rec){rec={};AM.set(el,rec)}rec[a]={o:v,t:t};el.setAttribute(a,t)}}})}
function walk(root){

var TITLE0=document.title;
function btn(){var b=document.getElementById('lang');if(b){b.textContent=LANG==='en'?'中文':'English';b.setAttribute('aria-label',LANG==='en'?'Switch to Traditional Chinese':'Switch to English');b.title=b.getAttribute('aria-label')}}

window.__setLang=function(l){
  if(l===LANG)return;LANG=l;try{localStorage.setItem('mp-lang',l)}catch(e){}

<script>
/* ============ CORE: data model, NC generation, DXF parsing (pure, no DOM) ============ */
var DEF={wcs:'G54',safeZ:10,so:10,depth:-5,unit:'mm',ball:6,mcodes:true,base:150,dprnt:false,prog:1,part:'PART-1',moves:true,reWcs:true,org:false,ox:0,oy:0,oz:0,thick:20,m3proj:true,m3op:1,rprt:false,hdr:true,pre:'',wcsLine:true,post:'',m30:true,saveExtra:true,colTol:''};
var st={ents:[],feats:[],set:Object.assign({},DEF),nextId:1};
var TN={pt:['單點','POINT'],c2:['角落 XY','CORNER XY'],c3:['角落 XYZ','CORNER XYZ'],idia:['內徑','BORE DIA'],odia:['外徑','SHAFT DIA'],iw:['內寬','INSIDE WIDTH'],ow:['外寬','OUTSIDE WIDTH'],dist:['距離','DISTANCE'],ang:['角度','ANGLE'],chk:['有無檢查','PRESENCE CHECK'],wp:['路徑點','WAYPOINT']};

function eq(a,b){return Math.abs(a-b)<1e-6}
function N(v){var inch=st.set.unit==='inch';if(inch)v=v/25.4;var p=inch?1e4:1e3;var r=Math.round(v*p)/p;if(r===0)r=0;var s=String(r);if(s.indexOf('e')>=0)s=r.toFixed(inch?4:3);if(s.indexOf('.')<0)s+='.';return s}
function NA(v){var r=Math.round(v*1000)/1000;if(r===0)r=0;var s=String(r);if(s.indexOf('.')<0)s+='.';return s}
function n3(v){var r=Math.round(v*1000)/1000;if(r===0)r=0;return String(r)}
function A(b,o){return '#[#'+b+'+'+o+']'}
function asc(n){return (n||'').replace(/[^\x20-\x7e]/g,'').replace(/[()]/g,'').trim()}
function tolOf(f){var k=f.tolKind||'none';
  var ck=!!f.tolChk;
  if(k==='size'||k==='both'){var up=+f.up||0,lo=+f.lo||0,T=(up-lo)/2;return {kind:k,sz:true,ps:k==='both',T:ck&&T>0?T:0,shift:ck?(up+lo)/2:0}}

  return {kind:'none',sz:false,ps:false,T:0,shift:0}}

function coneWarn(f,o){if(f.coneOk)return;
  if(f.manual)o.warn.push(['e','這個孔無法自動判定孔徑與中心 (可能是圓錐或自由曲面)：請自行輸入「中心 X/Y」、「直徑 S」與「探針 Z 深度」，確認後勾選「已確認」']);
  else if(f.cone)o.warn.push(['w','圓錐孔：孔徑隨 Z 變化 ('+(f.coneTxt||'')+')。目前直徑 Ø'+n3(f.d)+' 只在 Z='+n3(f.z)+' 有效，探測會在這個高度進行；請確認「探針 Z 深度」與「直徑 S」符合實際量測位置，確認後勾選「已確認」'])}

  if(!set)o.tol=tolTxt;
  /* I/J/K: only written when a WCS is written (W) and a value was entered; kept apart from the 9703 move position */
  var ijkAny=false,ijkNeed=false;
  function ijk(p,c){var ks=['I','J','K'],mp={I:'ix',J:'iy',K:'iz'};
    for(var q=0;q<3;q++){var k=ks[q];if(c[k]===undefined)continue;ijkNeed=true;
      var ev=f[mp[k]],has=ev!==''&&ev!==undefined&&ev!==null&&!isNaN(+ev);
      if(w&&has){p.push(k+N(+ev));ijkAny=true}
      else if(!set&&tl.kind==='pos'&&tl.T){p.push(k+N(c[k]));ijkAny=true}}}
  function tail(p,three){
    if(!set){if(tl.T)p.push('T'+N(tl.T));
      if(['pt','idia','odia','iw','ow'].indexOf(T)>=0&&f.tool!==''&&f.tool!=null&&!isNaN(+f.tool))p.push('E'+Math.round(+f.tool)+'.')}
    if(w)p.push('W'+w+'.');
    if(f.dprnt&&!three)p.push('V-1.')}
  function ang3(p){p.push('H'+NA(f.a1),'U'+NA(f.a2),'V'+NA(f.dprnt?-f.a3:f.a3));
    var a=[f.a1,f.a2,f.a3].map(function(x){return ((+x%360)+360)%360}).sort(function(x,y){return x-y});
    for(var q=0;q<3;q++){var g=(a[(q+1)%3]-a[q]+360)%360;if(g<10)o.warn.push(['w','3 點探測角度間隔需 ≥ 10°'])}}
  var sz=Math.max(S.safeZ,0);
  switch(T){
  case 'pt':{var ax=f.axis,d=+f.dir||1,ix={X:0,Y:1,Z:2}[ax],nv=ax==='X'?f.x:ax==='Y'?f.y:f.z;
    var s0=ax==='X'?[f.x-d*so,f.y,f.z]:ax==='Y'?[f.x,f.y-d*so,f.z]:[f.x,f.y,f.z-d*so];
    var e0=ax==='X'?[nv,f.y,f.z]:ax==='Y'?[f.x,nv,f.z]:[f.x,f.y,nv];
    var p=set?[ax+N(d*so)]:['A1.',ax+N(nv+tl.shift)];var c={};c[{X:'I',Y:'J',Z:'K'}[ax]]=nv;ijk(p,c);tail(p);
    o.steps.push({start:s0,parts:p,segs:[[s0,e0]]});
    o.res=[{a:A(111,ix),l:ax+' 位置'},{a:A(111,ix+3),l:ax+' 偏差'}];o.store=[A(111,ix)];o.nom=ax+' '+n3(nv);break}
  case 'c2':{var dx=+f.dx||1,dy=+f.dy||1,s0=[f.x-dx*so,f.y-dy*so,f.z];
    var p=set?['X'+N(dx*so),'Y'+N(dy*so)]:['A1.','X'+N(f.x+tl.shift),'Y'+N(f.y+tl.shift)];ijk(p,{I:f.x,J:f.y});tail(p);
    o.steps.push({start:s0,parts:p,segs:[[s0,[f.x,s0[1],f.z]],[s0,[s0[0],f.y,f.z]]]});
    o.res=[{a:A(111,0),l:'X 位置'},{a:A(111,1),l:'Y 位置'},{a:A(111,3),l:'X 偏差'},{a:A(111,4),l:'Y 偏差'}];o.store=[A(111,0),A(111,1)];
    o.nom='X '+n3(f.x)+'  Y '+n3(f.y);break}
  case 'c3':{var dx=+f.dx||1,dy=+f.dy||1,dz=+f.dz||-1,s0=[f.x-dx*so,f.y-dy*so,f.zc-dz*so];
    var p=set?['X'+N(dx*so),'Y'+N(dy*so),'Z'+N(dz*so)]:['A1.','X'+N(f.x+tl.shift),'Y'+N(f.y+tl.shift),'Z'+N(f.zc+tl.shift)];
    ijk(p,{I:f.x,J:f.y,K:f.zc});tail(p);
    o.steps.push({start:s0,parts:p,segs:[[s0,[f.x,s0[1],s0[2]]],[s0,[s0[0],f.y,s0[2]]],[s0,[s0[0],s0[1],f.zc]]]});
    o.res=[{a:A(111,0),l:'X 位置'},{a:A(111,1),l:'Y 位置'},{a:A(111,2),l:'Z 位置'}];o.store=[A(111,0),A(111,1),A(111,2)];
    o.nom='X '+n3(f.x)+'  Y '+n3(f.y)+'  Z '+n3(f.zc);break}
  case 'idia':{var obst=!!f.obst,r=f.d/2,s0=[f.x,f.y,obst?sz:f.z],p=[];
    if(set){if(obst)p.push('R'+N(-Math.abs(+f.R||10)));p.push('S'+N(f.d));if(f.three)ang3(p);if(obst)p.push('Z'+N(f.z-s0[2]))}
    else{p.push('A1.');if(obst)p.push('R'+N(-Math.abs(+f.R||10)));p.push('S'+N(f.d+tl.shift));if(f.three)ang3(p);if(obst)p.push('Z'+N(f.z))}
    ijk(p,{I:f.x,J:f.y});tail(p,f.three);
    var an=f.three?[f.a1,f.a2,f.a3]:[0,90,180,270],sg=[];

function simPos(t){var s=G.sim;if(!s.length)return null;if(s.length===1||t<=0)return s[0];
  for(var i=1;i<s.length;i++){if(sim.len[i]>=t){var seg=sim.len[i]-sim.len[i-1],u=seg?(t-sim.len[i-1])/seg:1,a=s[i-1],b=s[i];

  return s[s.length-1]}

  r.textContent=(hit?'⚠ 可能干涉  ':'')+'X '+p.x.toFixed(2)+'  Y '+p.y.toFixed(2)+'  Z '+p.z.toFixed(2)+(f?'  ·  '+(fi+1)+' '+f.name:'')+(p.kind==='probe'?'  · 探測中':'')}

  if(sim.t>=sim.tot){sim.t=sim.tot;sim.play=false;$('#play').textContent='▶ 模擬路徑'}

    T3.down={x:px,y:py,lx:px,ly:py,moved:false,pan:(e.button===1||e.button===2||e.shiftKey||tool==='pan')}});
  dom.addEventListener('pointermove',function(e){var r=dom.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
    if(T3.ptrs.has(e.pointerId))T3.ptrs.set(e.pointerId,{x:px,y:py});
    if(T3.pinch&&T3.ptrs.size===2){var a=Array.from(T3.ptrs.values()),nd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);T3.dist=Math.max(0.5,T3.pinch.dist*T3.pinch.d/Math.max(nd,1));
      var mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2,kk=T3.dist*2*Math.tan(T3.cam.fov*Math.PI/360)/CH,cc=T3.cam,rt=new THREE.Vector3().setFromMatrixColumn(cc.matrixWorld,0),upv=new THREE.Vector3().setFromMatrixColumn(cc.matrixWorld,1);
      T3.tgt.addScaledVector(rt,-(mx-T3.pinch.mx)*kk).addScaledVector(upv,(my-T3.pinch.my)*kk);T3.pinch.mx=mx;T3.pinch.my=my;render3();return}
    var d=T3.down;
    if(d){var dx=px-d.lx,dy=py-d.ly;if(Math.abs(px-d.x)+Math.abs(py-d.y)>4)d.moved=true;
      if(d.moved){if(d.pan){var k=T3.dist*2*Math.tan(T3.cam.fov*Math.PI/360)/CH,c=T3.cam,right=new THREE.Vector3().setFromMatrixColumn(c.matrixWorld,0),up=new THREE.Vector3().setFromMatrixColumn(c.matrixWorld,1);
          T3.tgt.addScaledVector(right,-dx*k).addScaledVector(up,dy*k)}
        else{T3.az-=dx*0.008;T3.el=Math.max(-1.5,Math.min(1.5,T3.el+dy*0.008))}
        d.lx=px;d.ly=py;render3()}return}
    if(!T3.hq){T3.hq=true;var X=px,Y=py;requestAnimationFrame(function(){T3.hq=false;setHover(X,Y)})}});
  function up(e){T3.ptrs.delete(e.pointerId);if(T3.ptrs.size<2)T3.pinch=null;var d=T3.down;T3.down=null;
    if(d&&!d.moved&&e.type==='pointerup'){var r=dom.getBoundingClientRect();onClick3(e.clientX-r.left,e.clientY-r.top)}}

  dom.addEventListener('wheel',function(e){e.preventDefault();T3.dist=Math.max(0.5,Math.min(1e6,T3.dist*Math.pow(1.0015,e.deltaY)));render3()},{passive:false})}

function b64(a){var u=new Uint8Array(a.buffer,a.byteOffset,a.byteLength),s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function unb64(s,C){var bs=atob(s),u=new Uint8Array(bs.length);for(var i=0;i<bs.length;i++)u[i]=bs.charCodeAt(i);return new C(u.buffer)}

function bgInfo(){return bg&&bg.img&&/^data:/.test(bg.img.src)?{name:bg.name,x:bg.x,y:bg.y,w:bg.w,op:bg.op,src:bg.img.src}:null}

    if(!legacy&&o.bg){var im=new Image();im.onload=function(){bg={img:im,name:o.bg.name,x:o.bg.x,y:o.bg.y,w:o.bg.w,op:o.bg.op};idbBgSig='';draw()};im.src=o.bg.src}else if(!legacy)bg=null;
    hist.length=0;views.XY.i=views.XZ.i=views.YZ.i=0;pushHist();if(!opt.quiet||opt.vp==null){views[vp].i=1}fit();renderPane();recompute();
    if(!opt.quiet){var ms=!legacy&&!o.model&&o.model3d;toast(ms?'已開啟專案。此專案的 3D 來源檔是「'+ms.name+'」，但檔案未內嵌，請到「設定」按「重新載入來源檔」':'已開啟專案')}}

      M=M3.build([{pos:pos,nrm:nrm,idx:idx,faces:m.faces.map(function(f){return {first:f[0],last:f[1]}})}],m.name);

/* IndexedDB (silent autosave inside this browser) */
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('blum-mp',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}

function idbGet(k){return idb().then(function(d){return new Promise(function(res,rej){var q=d.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=function(){d.close();res(q.result)};q.onerror=function(){rej(q.error)}})})}
var autoT=0,restoring=true,idbModelRef,idbBgSig,fsh=null,fsOK=!!(window.showSaveFilePicker&&window.showOpenFilePicker),fsNeed=false,lastAuto=0;

/* File System Access: optional linked .json file written silently once permission is granted */
